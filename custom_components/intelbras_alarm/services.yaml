bypass_zone:
  name: Anular ou reativar zonas
  description: >-
    Anula (bypass) ou reativa uma ou mais zonas de uma vez, preservando as
    demais anulações já existentes. Usa sempre a senha memorizada da
    central (não é afetado pelas opções "Exigir senha ao ativar/desativar",
    que só se aplicam a comandos de ativação/desativação).
  target:
    entity:
      integration: intelbras_alarm
      domain: alarm_control_panel
  fields:
    zones:
      name: Zonas
      description: >-
        Uma ou mais zonas: intervalos e/ou números individuais separados
        por ponto e vírgula. Formato: 1-5;8;10-15 (zonas 1 a 5, mais a 8,
        mais 10 a 15).
      required: true
      example: "1-5;8;10-15"
      selector:
        text:
    bypass:
      name: Anular
      description: >-
        Marque para anular (bypass) as zonas; desmarque para reativá-las.
        Padrão: anular.
      required: false
      default: true
      selector:
        boolean:

send_raw_command:
  name: Enviar comando bruto (diagnóstico avançado)
  description: >-
    Envia um comando ISECNet "cru" pela mesma conexão já aberta com a
    central e devolve a resposta bruta — para testar comandos ainda não
    implementados/documentados pela integração. Contorna as validações
    normais de propósito: a central executa o que for enviado, então use
    com cuidado. Não gera erro em caso de NACK — o objetivo é justamente
    ver a resposta, incluindo um NACK, não interromper a chamada.
  target:
    entity:
      integration: intelbras_alarm
      domain: alarm_control_panel
  fields:
    frame:
      name: Frame completo
      description: >-
        O frame inteiro em hex, incluindo cabeçalho e checksum (ex.:
        "08 E9 21 31 32 33 34 42 21 5B"). Enviado exatamente como digitado,
        a menos que "Calcular checksum" esteja marcado. Deixe em branco
        para usar "Comando" + "Conteúdo" no lugar.
      required: false
      example: "08 E9 21 31 32 33 34 42 21 FF"
      selector:
        text:
    calculate_checksum:
      name: Calcular checksum
      description: >-
        Só se aplica junto com "Frame completo". Se marcado, recalcula e
        substitui o ÚLTIMO byte do frame pelo checksum correto antes de
        enviar — digite o frame quase inteiro e termine com qualquer byte
        de preenchimento (ex.: FF) no lugar do checksum.
      required: false
      default: false
      selector:
        boolean:
    command:
      name: Comando
      description: >-
        Só usado se "Frame completo" estiver em branco. Um único byte de
        comando (ex.: "42" ou "0x42") — a integração monta o frame inteiro
        sozinha (cabeçalho, senha, checksum).
      required: false
      example: "0x42"
      selector:
        text:
    content:
      name: Conteúdo
      description: >-
        Só usado junto com "Comando". Os bytes de conteúdo do comando, em
        hex (ex.: "01 02 03"). Deixe em branco para um comando sem
        conteúdo.
      required: false
      example: "01 02 03"
      selector:
        text:
    password:
      name: Senha
      description: >-
        Só usado junto com "Comando". Senha a usar no lugar da senha
        principal memorizada (mesmo formato, 4 a 6 dígitos).
      required: false
      selector:
        text:

read_events:
  name: Ler log de eventos
  description: >-
    Lê o log de eventos completo da central (até 256 eventos, EEPROM via
    comando 0x5C) e devolve todos já traduzidos (data/hora, zona ou
    usuário, partição, código e descrição) na resposta do serviço. Também
    atualiza a entidade "Últimos eventos" com os mais recentes. Sempre lê
    e ordena o log inteiro pela data/hora real de cada evento — a ordem
    de endereço na memória da central não corresponde à ordem
    cronológica (confirmado em testes reais). Só funciona nos
    modelos/firmwares com acesso a esse comando (ver README) — levanta
    erro claro nos demais, sem tentar nada na central.
  target:
    entity:
      integration: intelbras_alarm
      domain: alarm_control_panel
