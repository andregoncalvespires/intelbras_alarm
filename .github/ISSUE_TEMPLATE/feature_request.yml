name: 💡 Sugerir uma funcionalidade
description: Uma ideia, melhoria, ou funcionalidade que gostaria de ver
title: "[Sugestão] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideias são bem-vindas! Só um lembrete: este é um projeto pessoal,
        sem vínculo com a Intelbras — funcionalidades que exigem acesso a
        protocolos não documentados oficialmente podem levar tempo (ou não
        serem viáveis com segurança) para implementar.

  - type: textarea
    id: problema
    attributes:
      label: Qual problema ou necessidade motiva essa sugestão?
    validations:
      required: true

  - type: textarea
    id: solucao
    attributes:
      label: O que você imagina como solução?
    validations:
      required: true

  - type: dropdown
    id: modelo
    attributes:
      label: Modelo(s) de central relacionados (se aplicável)
      multiple: true
      options:
        - AMT 1016 NET
        - AMT 2018 E/EG
        - AMT 2018 (base, sem sufixo)
        - AMT 2018 E Smart
        - AMT 2018 E3G
        - AMT 2008 RF
        - AMT 2010
        - AMT 2110
        - AMT 2118 EG
        - AMT 3010
        - AMT 1000 Smart
        - GPRS 1000 UN
        - ANM 24 Net
        - ANM 24 Net G2
        - AMT 4010 SMART
        - AMT 8000
        - AMT 8000 Lite
        - AMT 8000 Pro
        - Não é específico de modelo
    validations:
      required: false
